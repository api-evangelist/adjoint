name: Adjoint
description: >-
  Adjoint Inc. is a Boston, Massachusetts fintech (founded 2016) that built distributed-ledger
  and smart-contract software for corporate treasury and insurance. Its flagship platform, Uplink,
  let financial firms onboard assets onto a permissioned ledger, manage balances, and author
  self-executing agreements in Adjoint's Financial Core Language (FCL), with SDKs to bridge to
  traditional systems. The company raised roughly $10.4M and competed with Kyriba, Trovata, and
  Modern Treasury. As of this enrichment pass the company appears dormant: its adjoint.io domain
  now resolves to a parked/expired Namecheap page, its GitHub organization returns 404, and no
  first-party client SDKs are published to public registries. This profile is a VC-portfolio
  enrichment stub; see the data-quality note below regarding the originally-attached website.
